<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Староста</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a18;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f2f2fb;--mut:#9a9ab8;
--ac:#7c6cff;--ac2:#5b8cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,rgba(124,108,255,.35),transparent),
radial-gradient(700px 500px at 110% 5%,rgba(91,140,255,.25),transparent),var(--bg);background-attachment:fixed}
#app{padding:0 14px calc(90px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 2px 10px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#8b7cff,#5b6cff);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 20px rgba(100,90,255,.45)}
header b{display:block;font-size:17px}header span{color:var(--mut);font-size:13px}
.pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.hero{text-align:center;padding:calc(40px + env(safe-area-inset-top)) 0 20px}
.hero .logo{width:76px;height:76px;font-size:40px;border-radius:24px;margin:0 auto 14px}
.hero h1{margin:0 0 4px;font-size:28px}.hero p{margin:0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h3{margin:0 0 6px;font-size:17px}h4{margin:14px 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:14px}p{margin:4px 0}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
select option{color:#000}
textarea{min-height:90px;resize:vertical}
.btn{display:block;width:100%;padding:13px;margin:8px 0 0;border:0;border-radius:13px;color:#fff;font:inherit;font-weight:600;
background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 18px rgba(100,90,255,.35)}
.btn.sec{background:var(--card);border:1px solid var(--bd);box-shadow:none}
.btn.red{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.4);color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .fit{flex:0 0 auto}
.nav{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.nav button{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.nav .mid{flex:1;text-align:center;font-weight:600}
.day{margin:16px 2px 6px;font-weight:700;display:flex;gap:8px;align-items:center}
.day small{color:var(--ac);font-weight:600}
.lesson{display:flex;gap:12px;align-items:center;padding:12px}
.lesson .tm{min-width:50px;text-align:center;font-weight:700;line-height:1.2}
.lesson .tm small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.lesson .nm{flex:1;min-width:0}.lesson .nm b{display:block}.lesson .nm span{color:var(--mut);font-size:13px}
.bd{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(124,108,255,.2);color:#b9b0ff;white-space:nowrap;margin-left:4px}
.bd.ok{background:rgba(52,211,153,.18);color:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
background:rgba(14,14,30,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:21px}.tabs button.on{color:#fff}.tabs button.on i{filter:drop-shadow(0 0 8px var(--ac))}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end}
.sheet.hidden,.viewer.hidden{display:none}
.sheet .in{width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:#12122a;border:1px solid var(--bd);
border-radius:22px 22px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;align-items:flex-start;gap:10px}.sheet .top h3{flex:1;font-size:19px}
.x0{border:0;background:var(--card);color:var(--tx);width:34px;height:34px;border-radius:99px;font-size:16px}
.hw{border:1px solid var(--bd);border-radius:14px;padding:10px;margin:8px 0;background:rgba(255,255,255,.04)}
.hw .t{white-space:pre-wrap;word-break:break-word}
.lnk{display:block;margin-top:6px;color:#9db4ff;text-decoration:underline;word-break:break-all}
.ph{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-top:8px;object-fit:cover}
.x{margin-top:8px;border:0;background:none;color:var(--bad);font:inherit;font-size:13px;padding:0}
.srow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.srow span{flex:1;min-width:0}
.seg{display:flex;gap:4px}
.seg button{width:40px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:16px;opacity:.55}
.seg button.on{opacity:1}
.seg button.on[data-v="0"]{background:rgba(52,211,153,.3);border-color:var(--ok)}
.seg button.on[data-v="2"]{background:rgba(251,191,36,.3);border-color:var(--warn)}
.seg button.on[data-v="1"]{background:rgba(248,113,113,.3);border-color:var(--bad)}
.sum{display:flex;gap:12px;color:var(--mut);font-size:14px;margin-bottom:4px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
.file{display:block;text-align:center;padding:12px;border:1px dashed var(--bd);border-radius:12px;margin:6px 0;color:var(--mut)}
.file.has{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;gap:6px;margin:6px 0}.chips button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font:inherit;font-size:14px}
.chips button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.code{font:700 26px ui-monospace,Menlo,monospace;letter-spacing:4px;text-align:center;padding:8px;border-radius:12px;background:rgba(124,108,255,.15);margin:6px 0}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--mut);font-size:14px}.chk input{width:auto;margin:0}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#242446;border:1px solid var(--bd);
padding:10px 16px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.spin{text-align:center;padding:30px;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden"><div class="in" id="sheetIn"></div></div>
<div id="viewer" class="viewer hidden"><img id="vimg" alt=""></div>
<div id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0a0a18'); tg.setBackgroundColor('#0a0a18'); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); x.setHours(0, 0, 0, 0); return x; };
const dlabel = s => { const d = parseISO(s); return DAYS[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const S = { me: null, tab: 'week', monday: mondayOf(new Date()) };
const canEdit = () => S.me && (S.me.role === 'owner' || S.me.role === 'helper');
const isOwner = () => S.me && S.me.role === 'owner';
const DEFAULT_SCHEDULE = `Понедельник
Классный час «Разговоры о важном»
1 пара Математика 208
2 пара Основы финансовой грамотности 222
3 пара КДО 408к

Вторник
1 пара Математика 208
2 пара Литература 226
3 пара Русский язык 408

Среда
1 пара Физкультура
2 пара Технология 309
3 пара Химия 407
4 пара Физика 214

Четверг
1 пара ОБЗР 404
2 пара Математика 208
3 пара Технология 309

Пятница
1 пара Информатика 308 / -
2 пара Физика 214
3 пара Инженерная графика 224
4 пара - / Информатика 308

Суббота
2 пара Обществознание 401
3 пара История 401
4 пара История 401`;
const ROLE = { owner: 'староста', helper: 'помощник', student: 'студент' };

async function api(path, o = {}) {
  const opt = { method: o.method || 'GET', headers: { 'X-Init-Data': (tg && tg.initData) || '' } };
  if (o.json) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(o.json); }
  if (o.form) opt.body = o.form;
  const r = await fetch(path, opt);
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || ('Ошибка ' + r.status));
  return d;
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
const ask = m => new Promise(r => (tg && tg.showConfirm) ? tg.showConfirm(m, r) : r(confirm(m)));
const openLink = u => (tg && tg.openLink) ? tg.openLink(u) : window.open(u, '_blank');
function buzz() { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
const shortUrl = u => u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48);
const t5 = s => s || '';

async function shrink(file, max = 1280) {
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82));
  } catch (e) { return file; }
}

function openSheet(html) { $('#sheetIn').innerHTML = html; $('#sheet').classList.remove('hidden'); }
function closeSheet() { $('#sheet').classList.add('hidden'); $('#sheetIn').innerHTML = ''; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#viewer').addEventListener('click', () => $('#viewer').classList.add('hidden'));
document.addEventListener('click', e => {
  const p = e.target.closest('.ph'); if (p) { $('#vimg').src = p.dataset.full; $('#viewer').classList.remove('hidden'); return; }
  const a = e.target.closest('.lnk'); if (a) openLink(a.dataset.url);
});

/* ---------- вход ---------- */
async function boot() {
  if (!tg || !tg.initData) {
    $('#app').innerHTML = '<div class="hero"><div class="logo">🎓</div><h1>Староста</h1><p>Открой это приложение из Telegram-бота</p></div>';
    return;
  }
  try { S.me = await api('/api/me'); } catch (e) { $('#app').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }
  S.me.role ? renderApp() : renderOnboard();
}

function renderOnboard() {
  $('#app').innerHTML = `
  <div class="hero"><div class="logo">🎓</div><h1>Староста</h1><p>Вся группа на одном экране</p></div>
  <div class="card"><h3>У меня есть код</h3><p class="mut">Его даёт староста</p>
    <input id="code" placeholder="Например K7M2QP" autocapitalize="characters" autocomplete="off">
    <button class="btn" id="join">Войти в группу</button></div>
  <div class="card"><h3>Я староста</h3><p class="mut">Создай группу и раздай коды студентам</p>
    <input id="gname" placeholder="Название группы, например ИС-21">
    <button class="btn sec" id="create">Создать группу</button></div>`;
  $('#join').onclick = async () => {
    try { await api('/api/join', { method: 'POST', json: { code: $('#code').value } }); S.me = await api('/api/me'); renderApp(); }
    catch (e) { toast(e.message); }
  };
  $('#create').onclick = async () => {
    try { await api('/api/create', { method: 'POST', json: { name: $('#gname').value } }); S.me = await api('/api/me'); renderApp(); }
    catch (e) { toast(e.message); }
  };
}

/* ---------- каркас ---------- */
function renderApp() {
  const tabs = [['week', '📅', 'Пары'], ['hw', '📝', 'ДЗ'], ['mat', '📚', 'Материалы']];
  if (canEdit()) tabs.push(['stat', '📊', 'Журнал']);
  tabs.push(['more', '⚙️', 'Ещё']);
  $('#app').innerHTML = `<header><div class="logo">🎓</div><div><b>${esc(S.me.group)}</b><span>Староста бот</span></div>
    <div class="pill">${ROLE[S.me.role]}</div></header><main id="view"></main>
    <nav class="tabs">${tabs.map(t => `<button data-tab="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { buzz(); go(b.dataset.tab); });
  go(S.tab);
}
async function go(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = '<div class="spin">Загрузка…</div>';
  try { await ({ week: viewWeek, hw: viewHw, mat: viewMat, stat: viewStat, more: viewMore })[tab](); }
  catch (e) { $('#view').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

/* ---------- пары ---------- */
async function viewWeek() {
  const a = iso(S.monday), b = addDays(S.monday, 6);
  const d = await api('/api/week?start=' + a);
  const byDay = {}; d.items.forEach(l => (byDay[l.day] = byDay[l.day] || []).push(l));
  const today = S.me.today;
  let html = `<div class="nav"><button id="pw">‹</button><div class="mid">${S.monday.getDate()} ${MON[S.monday.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}</div><button id="nw">›</button></div>
    <button class="btn sec" id="tod" style="margin:0 0 4px">Эта неделя</button>`;
  const days = Object.keys(byDay).sort();
  if (!days.length) html += `<div class="empty">На этой неделе пар нет.${isOwner() ? '<br>Отправь боту фото расписания или добавь пары во вкладке «Ещё».' : ''}</div>`;
  days.forEach(day => {
    html += `<div class="day">${dlabel(day)}${day === today ? '<small>сегодня</small>' : ''}</div>`;
    byDay[day].forEach(l => {
      html += `<div class="card lesson" data-id="${l.id}"><div class="tm">${esc(l.start || '·')}<small>${esc(l.finish)}</small></div>
        <div class="nm"><b>${esc(l.subject)}</b><span>${l.room ? 'ауд. ' + esc(l.room) : ''}</span></div>
        ${l.hwc ? `<span class="bd">📝 ${l.hwc}</span>` : ''}${l.marked ? '<span class="bd ok">✓</span>' : ''}</div>`;
    });
  });
  $('#view').innerHTML = html;
  $('#pw').onclick = () => { S.monday = addDays(S.monday, -7); go('week'); };
  $('#nw').onclick = () => { S.monday = addDays(S.monday, 7); go('week'); };
  $('#tod').onclick = () => { S.monday = mondayOf(new Date()); go('week'); };
  document.querySelectorAll('.lesson').forEach(c => c.onclick = () => openLesson(c.dataset.id));
}

function hwItem(h, del) {
  return `<div class="hw">${h.text ? `<div class="t">${esc(h.text)}</div>` : ''}
    ${h.link ? `<a class="lnk" data-url="${esc(h.link)}">🔗 ${esc(shortUrl(h.link))}</a>` : ''}
    ${h.photo ? `<img class="ph" src="/files/${esc(h.photo)}" data-full="/files/${esc(h.photo)}" loading="lazy" alt="">` : ''}
    ${del ? `<button class="x" data-del="${h.id}">Удалить</button>` : ''}</div>`;
}

async function openLesson(id) {
  openSheet('<div class="spin">Загрузка…</div>');
  let d;
  try { d = await api('/api/lesson/' + id); } catch (e) { closeSheet(); return toast(e.message); }
  const l = d.lesson, st = {}; (d.students || []).forEach(s => st[s.id] = s.status);
  let photo = null;
  const edit = canEdit();
  let html = `<div class="top"><h3>${esc(l.subject)}<br><span class="mut" style="font-weight:400">${dlabel(l.day)}${l.start ? ', ' + esc(l.start) : ''}${l.room ? ' · ауд. ' + esc(l.room) : ''}</span></h3><button class="x0" id="cl">✕</button></div>
    <h4>📝 Домашнее задание</h4>${d.hw.map(h => hwItem(h, edit)).join('') || '<p class="mut">Пока ничего не задали</p>'}`;
  if (edit) {
    html += `<div class="card"><textarea id="ht" placeholder="Что задали (текст)"></textarea>
      <input id="hl" placeholder="Ссылка (необязательно)" inputmode="url">
      <label class="file" id="hfl">📷 Прикрепить фото<input type="file" id="hf" accept="image/*" hidden></label>
      <button class="btn" id="hadd">Добавить ДЗ</button></div>
      <h4>✅ Кто на паре</h4>`;
    if (!d.students.length) html += '<p class="mut">Сначала добавь студентов во вкладке «Ещё».</p>';
    else {
      html += `<div class="sum" id="sum"></div><button class="btn sec" id="allok" style="margin:0 0 6px">Все пришли</button>`;
      d.students.forEach(s => {
        html += `<div class="srow"><span>${esc(s.name)}</span><div class="seg" data-sid="${s.id}">
          <button data-v="0" class="${s.status == 0 ? 'on' : ''}">✅</button><button data-v="2" class="${s.status == 2 ? 'on' : ''}">⏰</button><button data-v="1" class="${s.status == 1 ? 'on' : ''}">❌</button></div></div>`;
      });
      html += '<button class="btn" id="save">Сохранить отметки</button>';
    }
    if (isOwner()) html += '<button class="btn red" id="dl">Удалить пару</button>';
  }
  openSheet(html);
  $('#cl').onclick = closeSheet;
  const refresh = () => openLesson(id);
  document.querySelectorAll('#sheetIn [data-del]').forEach(b => b.onclick = async () => {
    if (!(await ask('Удалить это ДЗ?'))) return;
    try { await api('/api/hw/' + b.dataset.del, { method: 'DELETE' }); refresh(); } catch (e) { toast(e.message); }
  });
  if (!edit) return;
  $('#hf').onchange = e => { photo = e.target.files[0] || null; $('#hfl').classList.toggle('has', !!photo); $('#hfl').firstChild.textContent = photo ? '✅ Фото выбрано' : '📷 Прикрепить фото'; };
  $('#hadd').onclick = async () => {
    const b = $('#hadd'); b.disabled = true; b.textContent = 'Загружаю…';
    try {
      const fd = new FormData(); fd.append('lesson', id); fd.append('text', $('#ht').value); fd.append('link', $('#hl').value);
      if (photo) fd.append('photo', await shrink(photo), 'p.jpg');
      await api('/api/hw', { method: 'POST', form: fd }); toast('ДЗ добавлено ✅'); refresh();
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Добавить ДЗ'; }
  };
  if (d.students.length) {
    const sum = () => { const v = Object.values(st); $('#sum').innerHTML = `<span>✅ ${v.filter(x => x == 0).length}</span><span>⏰ ${v.filter(x => x == 2).length}</span><span>❌ ${v.filter(x => x == 1).length}</span>`; };
    sum();
    document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
      buzz(); const sid = b.parentNode.dataset.sid; st[sid] = +b.dataset.v;
      b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); sum();
    });
    $('#allok').onclick = () => { Object.keys(st).forEach(k => st[k] = 0); document.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === '0'))); sum(); };
    $('#save').onclick = async () => {
      try { await api('/api/attendance', { method: 'POST', json: { lesson: id, marks: st } }); toast('Сохранено ✅'); closeSheet(); go(S.tab); }
      catch (e) { toast(e.message); }
    };
  }
  if (isOwner()) $('#dl').onclick = async () => {
    if (!(await ask('Удалить пару вместе с ДЗ и отметками?'))) return;
    try { await api('/api/lesson/' + id, { method: 'DELETE' }); closeSheet(); go('week'); } catch (e) { toast(e.message); }
  };
}

/* ---------- ДЗ ---------- */
async function viewHw() {
  const d = await api('/api/homework');
  if (!d.items.length) { $('#view').innerHTML = '<div class="empty">Домашки пока нет 🎉</div>'; return; }
  let html = '', last = '';
  d.items.forEach(h => {
    if (h.day !== last) { html += `<div class="day">${dlabel(h.day)}${h.day === S.me.today ? '<small>сегодня</small>' : ''}</div>`; last = h.day; }
    html += `<div class="card"><b>${esc(h.subject)}</b><span class="mut"> ${esc(h.start)}</span>${hwItem(h, canEdit())}</div>`;
  });
  $('#view').innerHTML = html;
  document.querySelectorAll('#view [data-del]').forEach(b => b.onclick = async () => {
    if (!(await ask('Удалить это ДЗ?'))) return;
    try { await api('/api/hw/' + b.dataset.del, { method: 'DELETE' }); viewHw(); } catch (e) { toast(e.message); }
  });
}

/* ---------- материалы ---------- */
async function viewMat() {
  const d = await api('/api/materials');
  const by = {}; d.items.forEach(m => (by[m.subject] = by[m.subject] || []).push(m));
  let html = canEdit() ? '<button class="btn" id="madd" style="margin:6px 0 0">+ Добавить материал</button>' : '';
  const keys = Object.keys(by).sort();
  if (!keys.length) html += '<div class="empty">Тут будут методички, конспекты и ссылки по предметам</div>';
  keys.forEach(k => {
    html += `<div class="day">${esc(k)}</div>`;
    by[k].forEach(m => {
      let body = '';
      if (m.kind === 'link') body = `<a class="lnk" data-url="${esc(m.content)}">🔗 ${esc(m.title || shortUrl(m.content))}</a>`;
      else if (m.kind === 'photo') body = `${m.title ? `<b>${esc(m.title)}</b>` : ''}<img class="ph" src="/files/${esc(m.content)}" data-full="/files/${esc(m.content)}" loading="lazy" alt="">`;
      else body = `${m.title ? `<b>${esc(m.title)}</b>` : ''}<div class="t" style="white-space:pre-wrap">${esc(m.content)}</div>`;
      html += `<div class="card">${body}${canEdit() ? `<button class="x" data-del="${m.id}">Удалить</button>` : ''}</div>`;
    });
  });
  $('#view').innerHTML = html;
  document.querySelectorAll('#view [data-del]').forEach(b => b.onclick = async () => {
    if (!(await ask('Удалить материал?'))) return;
    try { await api('/api/materials/' + b.dataset.del, { method: 'DELETE' }); viewMat(); } catch (e) { toast(e.message); }
  });
  if (canEdit()) $('#madd').onclick = () => addMaterial(d.subjects);
}
function addMaterial(subjects) {
  let kind = 'link', file = null;
  openSheet(`<div class="top"><h3>Новый материал</h3><button class="x0" id="cl">✕</button></div>
    <input id="msub" list="sl" placeholder="Предмет"><datalist id="sl">${subjects.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
    <div class="chips"><button data-k="link" class="on">🔗 Ссылка</button><button data-k="photo">📷 Фото</button><button data-k="text">📄 Текст</button></div>
    <input id="mt" placeholder="Название (необязательно)">
    <div id="mbody"></div><button class="btn" id="msave">Сохранить</button>`);
  $('#cl').onclick = closeSheet;
  const body = () => {
    $('#mbody').innerHTML = kind === 'link' ? '<input id="mc" placeholder="https://..." inputmode="url">'
      : kind === 'text' ? '<textarea id="mc" placeholder="Текст конспекта"></textarea>'
      : '<label class="file" id="mfl">📷 Выбрать фото<input type="file" id="mf" accept="image/*" hidden></label>';
    if (kind === 'photo') $('#mf').onchange = e => { file = e.target.files[0] || null; $('#mfl').classList.toggle('has', !!file); $('#mfl').firstChild.textContent = file ? '✅ Фото выбрано' : '📷 Выбрать фото'; };
  };
  body();
  document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { kind = b.dataset.k; document.querySelectorAll('.chips button').forEach(x => x.classList.toggle('on', x === b)); body(); });
  $('#msave').onclick = async () => {
    const b = $('#msave'); b.disabled = true;
    try {
      const fd = new FormData(); fd.append('subject', $('#msub').value); fd.append('kind', kind); fd.append('title', $('#mt').value);
      if (kind === 'photo') { if (file) fd.append('photo', await shrink(file), 'p.jpg'); } else fd.append('content', $('#mc').value);
      await api('/api/materials', { method: 'POST', form: fd }); toast('Сохранено ✅'); closeSheet(); viewMat();
    } catch (e) { toast(e.message); b.disabled = false; }
  };
}

/* ---------- журнал (статистика) ---------- */
async function viewStat() {
  const d = await api('/api/stats');
  if (!d.items.length) { $('#view').innerHTML = '<div class="empty">Добавь студентов во вкладке «Ещё»</div>'; return; }
  const max = Math.max(d.limit, ...d.items.map(x => x.absent));
  const risk = d.items.filter(x => x.absent >= d.limit);
  let html = `<div class="card"><h3>Посещаемость</h3><p class="mut">🚨 ${risk.length} на грани (от ${d.limit} пропусков)</p></div>`;
  d.items.forEach(x => {
    const flag = x.absent >= d.limit ? '🚨' : (x.absent == d.limit - 1 && d.limit > 1 ? '⚠️' : '');
    html += `<div class="card"><div class="row"><b style="flex:1">${flag} ${esc(x.name)}</b><span class="mut fit">❌ ${x.absent} · ⏰ ${x.late}</span></div>
      <div class="bar"><i style="width:${Math.round(x.absent / max * 100)}%"></i></div></div>`;
  });
  $('#view').innerHTML = html;
}

/* ---------- ещё ---------- */
async function viewMore() {
  let html = '';
  if (isOwner()) {
    html += `<div class="card"><h3>Коды доступа</h3>
      <p class="mut">Студенты (смотрят расписание и ДЗ)</p><div class="code" data-c="${S.me.student_code}">${S.me.student_code}</div>
      <div class="row"><button class="btn sec" data-share="student">Поделиться</button><button class="btn sec" data-regen="student">Новый код</button></div>
      <p class="mut" style="margin-top:14px">Помощники (ещё и отмечают пары и добавляют ДЗ)</p><div class="code" data-c="${S.me.helper_code}">${S.me.helper_code}</div>
      <div class="row"><button class="btn sec" data-share="helper">Поделиться</button><button class="btn sec" data-regen="helper">Новый код</button></div></div>
      <div class="card"><h3>📅 Расписание текстом</h3>
        <p class="mut">Дни недели и пары по порядку. Время пар подставится по звонкам, кабинет берётся из строки.</p>
        <textarea id="stext" style="min-height:240px"></textarea>
        <label class="chk"><input type="checkbox" id="snext"> На следующую неделю</label>
        <button class="btn" id="supl">Загрузить расписание</button></div>
      <div class="card"><h3>➕ Добавить пару вручную</h3>
        <input type="date" id="ld"><div class="row"><input id="ls" placeholder="Начало 09:00"><input id="lf" placeholder="Конец 10:30"></div>
        <input id="ln" placeholder="Предмет"><input id="lr" placeholder="Аудитория">
        <button class="btn sec" id="ladd">Добавить</button></div>
      <div class="card"><h3>👥 Студенты</h3><p class="mut">Вставь список, каждый с новой строки</p>
        <textarea id="stx" placeholder="Иванов Иван&#10;Петров Пётр"></textarea><button class="btn" id="stadd">Добавить в список</button>
        <div id="stl" style="margin-top:10px"></div></div>`;
  } else {
    html += `<div class="card"><h3>${esc(S.me.group)}</h3><p class="mut">Ты в группе как ${ROLE[S.me.role]}.</p></div>`;
  }
  $('#view').innerHTML = html;
  if (!isOwner()) return;
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = () => {
    const c = b.dataset.share === 'helper' ? S.me.helper_code : S.me.student_code;
    const text = 'Заходи в журнал группы. Открой бота и введи код: ' + c;
    const u = 'https://t.me/share/url?url=' + encodeURIComponent('https://t.me/' + S.me.bot) + '&text=' + encodeURIComponent(text);
    tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u);
  });
  document.querySelectorAll('[data-regen]').forEach(b => b.onclick = async () => {
    if (!(await ask('Старый код перестанет работать. Продолжить?'))) return;
    try { await api('/api/regen', { method: 'POST', json: { which: b.dataset.regen } }); S.me = await api('/api/me'); viewMore(); } catch (e) { toast(e.message); }
  });
  $('#stext').value = DEFAULT_SCHEDULE;
  $('#supl').onclick = async () => {
    const b = $('#supl'); b.disabled = true; b.textContent = 'Загружаю…';
    try {
      const r = await api('/api/schedule_text', { method: 'POST', json: { text: $('#stext').value, next: $('#snext').checked } });
      toast('Готово ✅ Пар: ' + r.count); S.monday = parseISO(r.monday); go('week');
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Загрузить расписание'; }
  };
  $('#ladd').onclick = async () => {
    try {
      await api('/api/lesson', { method: 'POST', json: { day: $('#ld').value, start: $('#ls').value, finish: $('#lf').value, subject: $('#ln').value, room: $('#lr').value } });
      toast('Пара добавлена ✅'); $('#ln').value = '';
    } catch (e) { toast(e.message); }
  };
  const loadSt = async () => {
    const d = await api('/api/students');
    $('#stl').innerHTML = d.items.length ? d.items.map((s, i) => `<div class="srow"><span>${i + 1}. ${esc(s.name)}</span><button class="x" data-sd="${s.id}">Удалить</button></div>`).join('') : '<p class="mut">Список пуст</p>';
    document.querySelectorAll('[data-sd]').forEach(b => b.onclick = async () => {
      if (!(await ask('Удалить студента вместе с его отметками?'))) return;
      try { await api('/api/students/' + b.dataset.sd, { method: 'DELETE' }); loadSt(); } catch (e) { toast(e.message); }
    });
  };
  loadSt();
  $('#stadd').onclick = async () => {
    try { const r = await api('/api/students', { method: 'POST', json: { text: $('#stx').value } }); toast('Добавлено: ' + r.added); $('#stx').value = ''; loadSt(); }
    catch (e) { toast(e.message); }
  };
}

boot();
</script>
</body>
</html>
